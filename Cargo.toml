[workspace]
members = [
  "crates/duckduckgo-core",
  "crates/duckduckgo-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/ysm-dev/duckduckgo-cli"

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_complete_nushell = "4.6"
clap_mangen = "0.3"
fd-lock = "4.0"
httpmock = "0.8"
insta = "1.47"
is-terminal = "0.4"
jsonc-parser = { version = "0.32", features = ["serde"] }
owo-colors = "4.2"
predicates = "3.1"
proptest = "1.11"
scraper = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.20"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.48", features = ["fs", "macros", "rt", "time"] }
terminal_size = "0.4"
unicode-width = "0.2"
url = "2.5"
wreq = { version = "5.3", features = ["cookies", "gzip", "socks"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
